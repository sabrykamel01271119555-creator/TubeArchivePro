# TubeArchive Pro 2.3.2 - builds the OFFLINE setup wizard (TubeArchivePro_Setup_<version>.exe) on GitHub's Windows machine.
# Start it: GitHub -> Actions -> "Build setup" -> Run workflow   (the .exe appears under "Artifacts")
# or push a tag such as v2.3.2  -> the setup is attached to the Release of that tag automatically.
name: Build setup
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tools, wizard languages, icon
        shell: pwsh
        run: |
          ./build/get_tools.ps1
          python build/make_icon.py
          python build/check_build.py
      - name: Automatic tests
        run: python -m unittest discover -s tests
      - name: Program (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath build/dist --workpath build/work build/TubeArchivePro.spec
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c "from app.paths import APP_VERSION; print(APP_VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DMyAppVersion=$ver" build\installer.iss
          Get-ChildItem build\output
      - uses: actions/upload-artifact@v4
        with:
          name: TubeArchivePro-Setup
          path: build/output/TubeArchivePro_Setup_*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/output/TubeArchivePro_Setup_*.exe
